<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #4ec0ca;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
  }
  h1 { font-size: 28px; margin-bottom: 10px; color: #fff; text-shadow: 2px 2px 0 #543847; }
  canvas { border: 3px solid #543847; border-radius: 8px; }
  button {
    margin-top: 15px; padding: 10px 30px; font-size: 18px;
    background: #e8d71e; color: #543847; border: 3px solid #543847;
    border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  button:hover { background: #ffe94e; }
  .best { margin-top: 8px; color: #fff; font-size: 16px; text-shadow: 1px 1px 0 #543847; }
</style>
</head>
<body>
<h1>🐤 Flappy Bird</h1>
<canvas id="game" width="320" height="480"></canvas>
<button id="startBtn">开始游戏</button>
<div class="best">最高分：<span id="best">0</span></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.4, JUMP = -6.5, PIPE_W = 52, GAP = 120, PIPE_SPEED = 2.5;
let bird, pipes, score, running, animID, gameOver;
let best = parseInt(localStorage.getItem('flappyBest')) || 0;
document.getElementById('best').textContent = best;
const GROUND_H = 60;

function init() {
  bird = { x: 60, y: H/2, vy: 0, r: 15 };
  pipes = [];
  score = 0; running = true; gameOver = false;
  if (animID) cancelAnimationFrame(animID);
  loop();
}

let frameCount = 0;
function loop() {
  if (!running) return;
  frameCount++;
  step(); draw();
  animID = requestAnimationFrame(loop);
}

function step() {
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  // ground / ceiling
  if (bird.y + bird.r > H - GROUND_H || bird.y - bird.r < 0) { endGame(); return; }
  // pipes
  if (frameCount % 90 === 0) {
    const topH = 60 + Math.random() * (H - GROUND_H - GAP - 120);
    pipes.push({ x: W, top: topH, scored: false });
  }
  pipes.forEach(p => {
    p.x -= PIPE_SPEED;
    // collision
    if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
      if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP) { endGame(); return; }
    }
    if (!p.scored && p.x + PIPE_W < bird.x) { p.scored = true; score++; }
  });
  pipes = pipes.filter(p => p.x + PIPE_W > -10);
}

function endGame() {
  running = false; gameOver = true;
  if (score > best) { best = score; localStorage.setItem('flappyBest', best); document.getElementById('best').textContent = best; }
  // draw game over
  draw();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center';
  ctx.fillText('游戏结束', W/2, H/2 - 20);
  ctx.font = '24px Arial';
  ctx.fillText('得分：' + score, W/2, H/2 + 20);
}

function draw() {
  // sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  grad.addColorStop(0, '#4ec0ca'); grad.addColorStop(1, '#bee7e9');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H - GROUND_H);
  // ground
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#6b8e23'; ctx.fillRect(0, H - GROUND_H, W, 8);
  // pipes
  pipes.forEach(p => {
    // top pipe
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillStyle = '#5a9e1e'; ctx.fillRect(p.x - 3, p.top - 20, PIPE_W + 6, 20);
    // bottom pipe
    const botY = p.top + GAP;
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(p.x, botY, PIPE_W, H - GROUND_H - botY);
    ctx.fillStyle = '#5a9e1e'; ctx.fillRect(p.x - 3, botY, PIPE_W + 6, 20);
  });
  // bird
  const angle = Math.min(Math.max(bird.vy * 3, -30), 70) * Math.PI / 180;
  ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(angle);
  // body
  ctx.fillStyle = '#e8d71e';
  ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#543847'; ctx.lineWidth = 2; ctx.stroke();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -5, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(8, -5, 2.5, 0, Math.PI*2); ctx.fill();
  // beak
  ctx.fillStyle = '#e8571e';
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 2); ctx.lineTo(12, 6); ctx.closePath(); ctx.fill();
  ctx.restore();
  // score
  ctx.fillStyle = '#fff'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center';
  ctx.strokeStyle = '#543847'; ctx.lineWidth = 3;
  ctx.strokeText(score, W/2, 50); ctx.fillText(score, W/2, 50);
}

function flap() {
  if (!running) return;
  bird.vy = JUMP;
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });
document.getElementById('startBtn').addEventListener('click', init);
draw = draw; // initial
ctx.fillStyle = '#4ec0ca'; ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
