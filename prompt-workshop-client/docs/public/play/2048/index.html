<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf8ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    color: #776e65;
  }
  h1 { font-size: 48px; font-weight: bold; color: #776e65; margin-bottom: 5px; }
  .header { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
  .score-box {
    background: #bbada0;
    color: #fff;
    padding: 8px 20px;
    border-radius: 6px;
    text-align: center;
    min-width: 80px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; }
  .score-box .value { font-size: 22px; font-weight: bold; }
  .board {
    background: #bbada0;
    border-radius: 8px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 90px);
    grid-template-rows: repeat(4, 90px);
    gap: 10px;
  }
  .cell {
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    transition: all 0.1s;
  }
  button {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 16px;
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #7a6658; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238,228,218,0.73);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 36px;
    font-weight: bold;
  }
</style>
</head>
<body>
<h1>2048</h1>
<div class="header">
  <div class="score-box"><div class="label">得分</div><div class="value" id="score">0</div></div>
  <div class="score-box"><div class="label">最高分</div><div class="value" id="best">0</div></div>
</div>
<div style="position:relative">
  <div class="board" id="board"></div>
  <div class="overlay" id="overlay"><span id="msg"></span></div>
</div>
<button id="newBtn">新游戏</button>
<script>
const TILE_COLORS = {
  0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',
  32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',
  512:'#edc850',1024:'#edc53f',2048:'#edc22e'
};
const TILE_TEXT = { 0:'', 2:'#776e65', 4:'#776e65' };
let grid, score, best = parseInt(localStorage.getItem('best2048')) || 0;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
bestEl.textContent = best;

function init() {
  grid = Array.from({length:4}, () => Array(4).fill(0));
  score = 0; scoreEl.textContent = 0;
  overlay.style.display = 'none';
  addRandom(); addRandom(); render();
}
function addRandom() {
  const empty = [];
  grid.forEach((r,y) => r.forEach((v,x) => { if (!v) empty.push({x,y}); }));
  if (!empty.length) return;
  const c = empty[Math.floor(Math.random()*empty.length)];
  grid[c.y][c.x] = Math.random() < 0.9 ? 2 : 4;
}
function render() {
  boardEl.innerHTML = '';
  grid.forEach(row => row.forEach(v => {
    const d = document.createElement('div');
    d.className = 'cell';
    d.style.background = TILE_COLORS[v] || '#3c3a32';
    d.style.color = TILE_TEXT[v] || '#f9f6f2';
    d.style.fontSize = v > 512 ? '24px' : '32px';
    d.textContent = v || '';
    boardEl.appendChild(d);
  }));
}
function slide(row) {
  let arr = row.filter(v => v);
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) { arr[i] *= 2; score += arr[i]; arr.splice(i+1,1); }
  }
  while (arr.length < 4) arr.push(0);
  return arr;
}
function move(dir) {
  let moved = false;
  const g = grid.map(r => [...r]);
  if (dir === 'left') {
    for (let y = 0; y < 4; y++) { grid[y] = slide(grid[y]); }
  } else if (dir === 'right') {
    for (let y = 0; y < 4; y++) { grid[y] = slide(grid[y].reverse()).reverse(); }
  } else if (dir === 'up') {
    for (let x = 0; x < 4; x++) { const col = slide([grid[0][x],grid[1][x],grid[2][x],grid[3][x]]); for (let y=0;y<4;y++) grid[y][x]=col[y]; }
  } else {
    for (let x = 0; x < 4; x++) { const col = slide([grid[3][x],grid[2][x],grid[1][x],grid[0][x]]).reverse(); for (let y=0;y<4;y++) grid[y][x]=col[y]; }
  }
  for (let y=0;y<4;y++) for(let x=0;x<4;x++) if(grid[y][x]!==g[y][x]) moved=true;
  if (moved) {
    addRandom(); render();
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('best2048', best); }
    if (grid.flat().includes(2048)) { msgEl.textContent = '🎉 你赢了！'; overlay.style.display = 'flex'; }
    if (!canMove()) { msgEl.textContent = '游戏结束'; overlay.style.display = 'flex'; }
  }
}
function canMove() {
  for (let y=0;y<4;y++) for(let x=0;x<4;x++) {
    if (!grid[y][x]) return true;
    if (x<3 && grid[y][x]===grid[y][x+1]) return true;
    if (y<3 && grid[y][x]===grid[y+1][x]) return true;
  }
  return false;
}
document.addEventListener('keydown', e => {
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});
let tx, ty;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
});
document.getElementById('newBtn').addEventListener('click', init);
init();
</script>
</body>
</html>
