<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
  }
  h1 { font-size: 28px; margin-bottom: 10px; color: #00ff88; text-shadow: 0 0 10px #00ff8855; }
  .info { display: flex; gap: 30px; margin-bottom: 10px; font-size: 18px; }
  .info span { color: #ffcc00; }
  canvas {
    border: 3px solid #00ff88;
    box-shadow: 0 0 20px #00ff8833;
    image-rendering: pixelated;
  }
  button {
    margin-top: 15px;
    padding: 10px 30px;
    font-size: 18px;
    font-family: 'Courier New', monospace;
    background: #00ff88;
    color: #1a1a2e;
    border: none;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #00cc6a; }
  .overlay {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    padding: 30px;
    border: 2px solid #ff4444;
    color: #ff4444;
    font-size: 22px;
  }
  .overlay p { margin-bottom: 10px; }
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="info">得分：<span id="score">0</span></div>
<div style="position:relative">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="overlay" id="overlay">
    <p>游戏结束</p>
    <p>得分：<span id="finalScore">0</span></p>
  </div>
</div>
<button id="startBtn">开始游戏</button>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const finalScoreEl = document.getElementById('finalScore');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const gridSize = 20;
const tileCount = canvas.width / gridSize;
let snake, food, dx, dy, score, running, timer;

function init() {
  snake = [{ x: 10, y: 10 }];
  dx = 1; dy = 0;
  score = 0;
  scoreEl.textContent = '0';
  overlay.style.display = 'none';
  placeFood();
  running = true;
  if (timer) clearInterval(timer);
  timer = setInterval(gameLoop, 120);
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function gameLoop() {
  if (!running) return;
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    clearInterval(timer);
    finalScoreEl.textContent = score;
    overlay.style.display = 'flex';
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // grid
  ctx.strokeStyle = '#2a2a4e';
  for (let i = 0; i < tileCount; i++) {
    ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
  }
  // food
  ctx.fillStyle = '#ff4444';
  ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8;
  ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
  ctx.shadowBlur = 0;
  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#00ff88' : '#00cc66';
    ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp':    if (dy !== 1)  { dx = 0; dy = -1; } break;
    case 'ArrowDown':  if (dy !== -1) { dx = 0; dy = 1;  } break;
    case 'ArrowLeft':  if (dx !== 1)  { dx = -1; dy = 0; } break;
    case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0;  } break;
  }
});

startBtn.addEventListener('click', init);
draw = draw || null;
ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
